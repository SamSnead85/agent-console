# gitleaks configuration for the public-safety workflow: the default rules,
# plus the two synthetic shapes the test suite uses on purpose. Every
# credential-shaped fixture is assembled at runtime from pieces
# (test/fixtures/secrets.js), so what is allowed here is a canary label or a
# reference to one, never a value.
title = "Agent Console"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic canaries (CANARY-<WORD>-<4 hex>) and references to the runtime-built fixtures"
regexTarget = "secret"
regexes = [
  '''^CANARY-[A-Z-]+-[0-9a-f]{4}$''',
  '''^ops:" \+ SECRETS\.[A-Za-z]+ \+ "$''',
]

[[allowlists]]
description = "Generated fixtures: a lane's key is a hex digest of synthetic demo ids, not a credential"
condition = "AND"
paths = ['''^fixtures/[a-z0-9.-]+\.json$''']
regexTarget = "match"
regexes = ['''^key": "[0-9a-f]{12,64}"$''']
