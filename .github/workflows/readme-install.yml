name: README install line
# The README's one-line install, run exactly as a newcomer would, against the
# published release (docs/PRINCIPLES.md §1). On pushes to main, when a release
# is published, and weekly, so a broken first step is found before a
# newcomer finds it.
on:
  push:
    branches: [main]
    paths: [README.md, package.json]
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: README install line (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/readme-install.mjs
