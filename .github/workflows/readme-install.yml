name: README install line
# The README's one-line install, run exactly as a newcomer would, against the
# published release (docs/PRINCIPLES.md §1). Development pushes explicitly
# allow a pending release; scheduled/manual checks require a working package.
# Release acceptance lives in release.yml, after successful asset upload.
on:
  push:
    branches: [main]
    paths: [README.md, package.json]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: ${{ github.event_name == 'push' && 'README availability (pending allowed)' || 'README published install' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify the README install command
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            node scripts/readme-install.mjs --allow-pending-release
          else
            node scripts/readme-install.mjs
          fi
