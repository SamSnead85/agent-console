name: Release asset
# When a release is published, CI builds the package from the release's tag,
# tests it, attaches it with its SHA-256, and records a signed build
# provenance attestation for it. The one-line install and every join command
# fetch exactly this file; nothing is built on anyone's own machine. The
# standalone executables (binaries.yml) are built from the same tag and go
# under the same SHA256SUMS and attestation.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  executables:
    name: Standalone executables
    uses: ./.github/workflows/binaries.yml
    with:
      ref: ${{ github.event.release.tag_name }}
    secrets:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
  asset:
    name: Build, attest and attach the package
    # Waits for the executables but is never held back by them: if they fail,
    # the package still ships, and the last step fails to say so.
    needs: executables
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run smoke:pack
      - name: Collect the executables
        if: needs.executables.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-console-*
          merge-multiple: true
      - name: Pack
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          mkdir -p dist
          npm pack --pack-destination dist
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # No --clobber: a release file that already exists is never replaced
      # silently. If a file must really change, delete it on the release page
      # first, on purpose, and run this job again.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # Each executable is shown on the release page with its label: the
        # file name, the platform, and whether it is signed.
        run: |
          files=()
          for f in dist/*; do
            label="labels/$(basename "$f").label"
            if [ -f "$label" ]; then files+=("$f#$(cat "$label")"); else files+=("$f"); fi
          done
          gh release upload "$TAG" "${files[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY"
      - name: Every executable attached
        if: needs.executables.result != 'success'
        run: |
          echo "::error::The standalone executables did not build, so this release carries only the package. Fix binaries.yml and publish a patch release."
          exit 1
