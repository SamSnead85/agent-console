name: Public safety
# This repository is public: everything in it, in its history, in a pull
# request's title and body, and in its CI logs can be read by anyone. These
# two jobs stop a secret, a person's or a machine's name, a private path or
# address, or image metadata from getting in. See scripts/public-safety/.
on:
  push:
  pull_request:
    # "edited": a changed title or body is checked again, since GitHub builds
    # the squash commit's message from them.
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: public-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: The commits this change adds
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/public-safety/range.mjs >> "$GITHUB_OUTPUT"
      - name: Every commit in the change
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1 .
      - name: The tree as it stands
        run: |
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  public:
    name: Public-facing content only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The commits this change adds
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/public-safety/range.mjs >> "$GITHUB_OUTPUT"
      # The denylist of names that must never appear is a repository secret,
      # so it is not itself published. Pull requests from forks do not receive
      # secrets; they run every other check, and the push to main that lands
      # them runs this one in full.
      - name: Paths, addresses, machine names, credentials, image metadata and the private denylist
        env:
          PUBLIC_SAFETY_DENYLIST: ${{ secrets.PUBLIC_SAFETY_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          RANGE: ${{ steps.range.outputs.range }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          args=(--range "$RANGE")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--text-env PR_TITLE,PR_BODY); fi
          if [ "$FROM_FORK" != true ]; then args+=(--require-denylist); fi
          node scripts/public-safety/check.mjs "${args[@]}"
