name: Standalone executables
# Node.js with the release package inside, one file per platform, each built
# and then started on its own platform's runner (packaging/sea/). On a pull
# request that touches what goes inside, this proves every target still builds
# and starts. For a published release, release.yml calls it with the tag and
# attaches what it builds beside the package, under one SHA256SUMS and one
# signed build attestation. Nothing here publishes anything.
on:
  pull_request:
    paths:
      - packaging/sea/**
      - bin/**
      - lib/**
      - server.js
      - package.json
      - .github/workflows/binaries.yml
  # Run by hand with release checked, on a branch, it signs and notarizes
  # exactly as a release would: the dry run of signing before a tag.
  workflow_dispatch:
    inputs:
      release:
        description: Sign and notarize the macOS builds, as a release does
        type: boolean
        default: false
  workflow_call:
    # A release (release.yml passes release: true) must be signed and
    # notarized: without all five secrets its macOS builds fail, never ship
    # unsigned. Pull requests, and manual runs without release, build
    # unsigned and say so.
    inputs:
      ref:
        description: The release tag to build from
        required: true
        type: string
      release:
        description: Require Developer ID signing and notarization for macOS
        required: false
        type: boolean
        default: false
    secrets:
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_P12_PASSWORD:
        required: false
      APPLE_API_KEY_P8_BASE64:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Notarization and waiting for Apple to publish the ticket take minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15, exe: agent-console-darwin-arm64 }
          - { target: darwin-x64, runner: macos-15-intel, exe: agent-console-darwin-x64 }
          - { target: linux-x64, runner: ubuntu-24.04, exe: agent-console-linux-x64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, exe: agent-console-linux-arm64 }
          - { target: win32-x64, runner: windows-2025, exe: agent-console-win32-x64.exe }
    env:
      # A release signs and notarizes macOS, or fails. Other runs never sign.
      SIGN_MAC: ${{ inputs.release == true && startsWith(matrix.target, 'darwin-') }}
    steps:
      # Byte for byte the files the release tarball has: no CRLF on Windows.
      - name: Check out without line-ending conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The Node.js inside the executable: the current LTS line, at its latest
      # patch when the release is built (not whatever the runner has cached),
      # so every platform gets the same one and security fixes arrive by rebuilding.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
      - name: Install the build tool (postject, pinned by its lockfile)
        run: npm ci --prefix packaging/sea --ignore-scripts --no-audit --no-fund
      - name: Require the Apple signing secrets for a release
        if: env.SIGN_MAC == 'true'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          [ -n "$P12" ] || missing+=(MACOS_CERT_P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(MACOS_CERT_P12_PASSWORD)
          [ -n "$API_KEY" ] || missing+=(APPLE_API_KEY_P8_BASE64)
          [ -n "$API_KEY_ID" ] || missing+=(APPLE_API_KEY_ID)
          [ -n "$API_ISSUER" ] || missing+=(APPLE_API_ISSUER)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::A release's macOS executables must be signed with a Developer ID and notarized, and these repository secrets are missing: ${missing[*]}. Nothing unsigned is shipped in their place."
            exit 1
          fi
      - name: Load the Developer ID into a throwaway keychain
        id: apple
        if: env.SIGN_MAC == 'true'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The certificate's SHA-1, never its name: this log is public.
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::MACOS_CERT_P12_BASE64 holds no valid Developer ID Application identity"; exit 1; }
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
      # Signs, notarizes and asks Gatekeeper before labelling anything signed
      # (packaging/sea/build.mjs); with SIGN_MAC it fails rather than build unsigned.
      - name: Build
        shell: bash
        env:
          AGENT_CONSOLE_REQUIRE_SIGNING: ${{ env.SIGN_MAC == 'true' && '1' || '' }}
          MACOS_SIGN_IDENTITY: ${{ steps.apple.outputs.identity }}
          APPLE_NOTARY_KEY_PATH: ${{ steps.apple.outputs.key }}
          APPLE_NOTARY_KEY_ID: ${{ steps.apple.outputs.identity && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER: ${{ steps.apple.outputs.identity && secrets.APPLE_API_ISSUER || '' }}
        run: node packaging/sea/build.mjs --out sea
      - name: Start it, with no Node.js on PATH
        shell: bash
        run: node packaging/sea/smoke.mjs "sea/dist/${{ matrix.exe }}"
      - name: Remove the keychain
        if: always() && steps.apple.outcome == 'success'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-console-${{ matrix.target }}
          path: sea/
          if-no-files-found: error
          retention-days: 3
