name: Windows
# Informational: Windows is not yet a release target, so this job does not
# block a merge. It runs the parts a Windows user touches first — the console,
# joining by link and reporting — so the README can say honestly how they fare.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hub:
    name: Hub and reporter (windows-latest, Node 22)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test test/hub-registry.test.js test/hub-store.test.js test/hub-parts.test.js test/hub-e2e.test.js
      - run: npm run smoke:pack
