name: Publish to npm
# Called by release.yml, and only after the release's package installed on
# macOS, Linux and Windows from the release page. It publishes that exact file:
# downloaded from the release, checked against SHA256SUMS and its signed build
# attestation, and its version checked against the tag. Nothing is packed again.
#
# npm organisation ownership and the NPM_TOKEN secret are configured by a
# maintainer. Until they are, this says so and publishes nothing; the download page
# keeps npm marked "coming" until the registry has the version.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag whose package to publish
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the release's package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the npm token
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not configured, so nothing was published to npm. A maintainer creates the lockedinlabs npm organisation and adds its automation token as the NPM_TOKEN repository secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download and check the release's package
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          file="lockedinlabs-agent-console-${version}.tgz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --pattern SHA256SUMS
          expected="$(awk -v f="$file" '$2 == f { print $1 }' SHA256SUMS)"
          test "${#expected}" -eq 64
          test "$(sha256sum "$file" | awk '{ print $1 }')" = "$expected"
          gh attestation verify "$file" -R "$GITHUB_REPOSITORY"
          test "$(tar -xzOf "$file" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = "$version"
          echo "FILE=$file" >> "$GITHUB_ENV"
      - name: Publish with provenance
        if: steps.token.outputs.ready == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./$FILE" --provenance --access public
