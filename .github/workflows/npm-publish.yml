name: Publish to npm

# npm organisation ownership and NPM_TOKEN are configured by the owner.
# A tag alone cannot publish without the secret, and the package version must match it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require owner npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_TOKEN is missing. The owner must create the lockedinlabs npm organisation and configure its publishing token.' >&2
            exit 1
          fi
      - name: Match the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm test
      - run: npm run smoke:pack
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
